[town]
name = "yamatai"
display = "Yamatai (邪馬台)"
population = "JPT"
samples = ["NA18940", "NA18943", "NA18945", "NA18952", "NA18970", "NA18990", "NA19007", "NA19066", "NA19079", "NA19088"]
rig = "yamatai-rig"
agent = "pangenome-town.townsfolk"
citation = "Kulmanov M, Liu Y, Tawfiq R, et al. Phased genome assemblies and pangenome graphs of human populations of Japan and Saudi Arabia. Sci Data 12, 1316 (2025). doi:10.1038/s41597-025-05652-y"

[town.peers]
camelot = "camelot"
ubar = "ubar"

[data]
graph = "../data/jasapage/JaSaPaGe.gbz"
vcf = "../data/jasapage/JaSaPaGe.GRCh38.vcf.gz"
reference_paths = ["GRCh38", "CHM13v2"]
reference_path_template = "{assembly}#0#{chrom}"
default_assembly = "GRCh38"

[exchange]
db = "../data/exchange.db"
supervisor_url = "http://127.0.0.1:8372"
state_dir = ".gc/town"

[rcp]
graph_id = "JaSaPaGe-v1"
# Reputation comes from the Wasteland commons (stamps other rigs put on a requester's handle).
# The commons directory defaults to the wasteland joined with `wl` (~/.config/wasteland/wastelands/*).
# commons_dir = "~/.local/share/wasteland/academic-wasteland/commons"
reputation_threshold = 1.0
reputation_min_authors = 1
# Short-circuits: a human operator is always trusted; nobody is blocked.
trusted_requesters = ["https://orcid.org/0000-0001-8149-5890"]
blocked_requesters = []

[trust]
# Where credentials are applied for and their revocation status is checked (Camelot's envoy through the supervisor).
registrar = "http://127.0.0.1:8372/v0/city/camelot/svc/envoy/"
revocation = "required"
# Trust anchors: issuers whose authority this town accepts directly (pinned keys). Other issuers count only
# through accreditations that chain to an anchor, and the reasoner decides that chain.
anchors = { "https://w3id.org/academic-wasteland/camelot/issuers/ethics-council" = "ed25519:seGCer9_zlMqtNycVI19l-gW1ppLlR8k_sR4E7CSiI8" }

# Controlled-access tier: a SIMULATED restriction over the open JaSaPaGe VCF. It resides only at DDBJ (as controlled
# human data in Japan would), so until the ddbj site is enabled this town can admit but not run such tasks.
[[restricted_datasets]]
key = "jpt-individual-genotypes"
iri = "https://w3id.org/academic-wasteland/yamatai/datasets/jpt-individual-genotypes"
name = "JPT individual genotypes (simulated controlled-access tier)"
source = "vcf"

[compute]
dispatch = "inline"

[[sites]]
name = "workstation"
driver = "local"
datasets = ["graph", "vcf"]
tools = ["bcftools"]
max_cpus = 4
max_mem_gb = 16
max_wall_seconds = 900

[[sites]]
# Yamatai holds Slurm submission capability; dataset custody is independent.
# The `ddbj` ssh alias reaches the gw gateway, which has no Slurm configuration; jobs are submitted from the login
# node a001 (a002 and a003 also work), so every remote step runs as `ssh ddbj ssh a001 ...`. Default partition: epyc.
# bcftools 1.19 is installed there, vg is not, so graph deconstruction cannot run at DDBJ yet.
name = "ddbj"
storage = "ddbj"
driver = "ssh"
host = "ddbj"
submit_host = "a001"
workdir = "/home/leechuck/wasteland/yamatai"
scheduler = "slurm"
enabled = true
datasets = ["graph", "vcf", "jpt-individual-genotypes"]
tools = ["bcftools"]
max_cpus = 8
max_mem_gb = 64
max_wall_seconds = 7200
paths = { graph = "/home/asianhla/data/JaSaPaGe/JaSaPaGe.gbz", vcf = "/home/asianhla/data/JaSaPaGe/JaSaPaGe.GRCh38.vcf.gz", "jpt-individual-genotypes" = "/home/asianhla/data/JaSaPaGe/JaSaPaGe.GRCh38.vcf.gz" }

[federation]
# Private relay identity for replies to independently hosted towns.
state = "~/.config/wasteland-bridge/yamatai"

# Bounded direct execution explicitly permitted by the operator on DDBJ.
# Heavy jobs use Yamatai's Slurm route; logical dataset grants select the cohort.
[[sites]]
name = "ddbj-direct"
storage = "ddbj"
driver = "ssh"
host = "ddbj"
scheduler = "none"
workdir = "/home/leechuck/wasteland/yamatai/direct"
datasets = []
tools = ["bcftools"]
max_cpus = 1
max_mem_gb = 2
max_wall_seconds = 600

[custody]
key = "~/.config/wasteland-custody/yamatai/custody.key"

[[datasets]]
id = "ubar-jasapage"
version = "JaSaPaGe-v1-GRCh38"
custodian = "ubar"
public_key = "ed25519:ycDcbml6y3aSfONP9yQ4ZhtzJvPJR0w9Ejqb1Bctt9I"
samples = ["ksa001", "ksa002", "ksa003", "ksa004", "ksa005", "ksa006", "ksa007", "ksa008", "ksa009"]
access = "public-source"
workflows = ["allele-frequency", "genotype-export"]
[datasets.locations.ddbj]
vcf = "/home/asianhla/data/JaSaPaGe/JaSaPaGe.GRCh38.vcf.gz"

[[datasets]]
id = "yamatai-jasapage"
version = "JaSaPaGe-v1-GRCh38"
custodian = "yamatai"
public_key = "ed25519:FPjKRojfkOv51G7Mrwg-zYler0N8pzHo5SzH-RHXsE0"
samples = ["NA18940", "NA18943", "NA18945", "NA18952", "NA18970", "NA18990", "NA19007", "NA19066", "NA19079", "NA19088"]
access = "public-source"
workflows = ["allele-frequency", "genotype-export"]
[datasets.locations.ddbj]
vcf = "/home/asianhla/data/JaSaPaGe/JaSaPaGe.GRCh38.vcf.gz"

[[resources]]
name = "pangenome-results"
root = "/home/leechuck/Public/software/pangenome/hla-viz"
source = "bio-ontology-research-group/pangenome — hla-viz generated results"
include = ["*.tsv", "*.pdf", "stage3_tables/*.tsv", "figures/*.png", "figures/*.pdf", "plots/*.png", "plots/*.pdf", "gene_graphs/*.stats.tsv"]

[private_variant_demo]
enabled = true
vcf = "/home/leechuck/Public/software/academic-wasteland/yamatai/.gc/private-variant-demo/patient.vcf"
